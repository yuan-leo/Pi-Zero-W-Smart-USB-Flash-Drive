<VirtualHost *:80>
    ServerName 3dprinter.local
    DocumentRoot /var/www/usb-share
    <Directory /var/www/usb-share>
        Require all granted
        AllowOverride None
        Options -Indexes -ExecCGI
    </Directory>
    # The application refuses HTTP credentials by default. Configure a TLS vhost
    # with this same DocumentRoot, then redirect this HTTP vhost to HTTPS.
</VirtualHost>
